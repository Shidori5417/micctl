[package]
name = "micctl"
version = "1.0.0"
license = "MIT"
edition = "2021"
authors = ["shidori"]
description = "PipeWire Microphone DSP, Soundboard & FX CLI/TUI Tool"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "5.0"
hound = "3.5"
notify-rust = { version = "4", default-features = false, features = ["d"] }
colored = "2.1"
libc = "0.2"
